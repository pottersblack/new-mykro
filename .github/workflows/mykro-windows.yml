name: Windows exe

"on":
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-build.txt

      - name: Build MYKRO.exe
        run: python build_exe.py

      - name: Smoke test
        shell: pwsh
        run: |
          $exe = Join-Path $PWD "dist\MYKRO.exe"
          if (-not (Test-Path $exe)) {
            throw "MYKRO.exe was not produced at $exe"
          }
          Write-Host "Built $exe ($((Get-Item $exe).Length) bytes)"
          & $exe --version
          if ($LASTEXITCODE -ne 0) { throw "MYKRO.exe --version exited $LASTEXITCODE" }
          $log = Join-Path $PWD "self-check-unconfigured.txt"
          & $exe --self-check *> $log
          $code = $LASTEXITCODE
          Get-Content $log
          $text = Get-Content $log -Raw
          if ($text -notmatch "config_path:") { throw "self-check did not report config_path" }
          if ($text -notmatch "MYKRO[\\/]config\.json") {
            throw "self-check config_path is not %LOCALAPPDATA%\MYKRO\config.json"
          }
          if ($text -notmatch "probe:") { throw "self-check did not report a probe result" }
          # A clean runner has no reachable model. Readiness must fail closed.
          if ($code -eq 0) {
            throw "Fresh runner self-check exited 0. An unwired config must fail closed."
          }

      - name: Upload MYKRO.exe
        uses: actions/upload-artifact@v4
        with:
          name: MYKRO-windows
          path: dist/MYKRO.exe
          if-no-files-found: error

      - name: Attach exe to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          gh release view $tag
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag dist/MYKRO.exe --clobber
          } else {
            gh release create $tag dist/MYKRO.exe --title $tag --notes "MYKRO Windows executable"
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
